name: Persist Learning State

on:
  workflow_run:
    workflows: ["Viral Video Automation"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  persist:
    if: ${github.event.workflow_run.conclusion == 'success'}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download learning artifact
        uses: actions/download-artifact@v5
        with:
          name: viral-videos-run-${github.event.workflow_run.run_number}
          path: learning-artifact
          run-id: ${github.event.workflow_run.id}
          github-token: ${secrets.GITHUB_TOKEN}

      - name: Persist learning state
        run: |
          if [ -f learning-artifact/learning_summary.json ]; then
            cp learning-artifact/learning_summary.json learning_state.json
          else
            echo "No learning summary found; nothing to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning_state.json
          if git diff --cached --quiet; then
            echo "Learning state unchanged."
            exit 0
          fi
          git commit -m "Update self-learning state [skip ci]"
          git push
