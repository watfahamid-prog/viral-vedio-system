name: Viral Video Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: viral-video-automation
  cancel-in-progress: false

jobs:
  create-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg and narration engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Validate Python modules
        run: |
          python -m compileall -q .
          python self_test.py

      - name: Run complete viral video pipeline
        env:
          DRY_RUN: "true"
          MAX_TRENDS: "12"
          VIDEO_COUNT: "3"
          VIDEO_SECONDS: "15"
          VIDEO_MIN_SECONDS: "15"
          VIDEO_MAX_SECONDS: "90"
          AI_MODE: "template"
          VIDEO_ENGINE: "auto"
          AI_VIDEO_ENABLED: "false"
          AI_VIDEO_PROVIDER: "fal-ai"
          AI_VIDEO_MODEL: "Wan-AI/Wan2.1-T2V-1.3B"
          AI_VIDEO_TIMEOUT: "45"
          AI_VIDEO_MAX_CLIPS: "1"
          TTS_ENGINE: "edge"
          TTS_VOICE: "en-US-AriaNeural"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_ENABLED: "false"
          TIKTOK_ENABLED: "false"
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Check generated outputs
        if: success()
        run: |
          test -f output/run_summary.json
          test -n "$(find output -maxdepth 1 -name '*.mp4' -type f | head -1)"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 output/*.mp4 | head
          echo "Generated video files:"
          ls -lh output/*.mp4

      - name: Save generated videos and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viral-videos-run-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
