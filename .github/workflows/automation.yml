name: Viral Video Automation v4 inspection

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: viral-video-automation
  cancel-in-progress: false

jobs:
  create-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg and narration engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Validate Python modules
        run: |
          python -m compileall -q .
          python self_test.py

      - name: Run complete viral video pipeline
        env:
          DRY_RUN: "true"
          MAX_TRENDS: "12"
          VIDEO_COUNT: "3"
          VIDEO_SECONDS: "20"
          VIDEO_MIN_SECONDS: "15"
          VIDEO_MAX_SECONDS: "60"
          AI_MODE: "openai"
          VIDEO_ENGINE: "auto"
          AI_VIDEO_ENABLED: "true"
          AI_VIDEO_PROVIDER: "fal-ai"
          AI_VIDEO_MODEL: "Wan-AI/Wan2.1-T2V-1.3B"
          AI_VIDEO_TIMEOUT: "45"
          AI_VIDEO_MAX_CLIPS: "1"
          TTS_ENGINE: "edge"
          TTS_VOICE: "en-US-AriaNeural"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_ENABLED: "false"
          TIKTOK_ENABLED: "false"
          PUBLISH_ENABLED: "false"
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          PUBLISH_PRIVACY: "private"
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Check generated outputs
        if: success()
        run: |
          set -e
          test -f output/run_summary.json
          test -f output/quality_report.json
          count="$(find output -maxdepth 1 -name '*.mp4' -type f | wc -l)"
          test "$count" -eq 3
          for video in output/*.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$video" | grep -qx '1080,1920'
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$video" | grep -qx 'aac'
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$video"
          done
          echo "Generated exactly 3 valid vertical videos:"
          ls -lh output/*.mp4

      - name: Persist self-learning state
        if: always()
        run: |
          if [ -f learning_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add learning_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update self-learning state [skip ci]"
              git push
            fi
          fi

      - name: Save generated videos and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viral-videos-visual-inspection-run-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
