name: Viral Video Automation v5 free-engine stack # final visual-engine validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: viral-video-automation-v2
  cancel-in-progress: true

jobs:
  create-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg and narration engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Validate Python modules
        run: |
          python -m compileall -q .
          python self_test.py

      - name: Verify Gemini API secret
        env:
          ZERO_COST_MODE: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: |
          set -euo pipefail
          if [ "${ZERO_COST_MODE:-false}" = "true" ]; then
            echo "ZERO_COST_MODE enabled; skipping external Gemini API verification."
            exit 0
          fi
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY is not configured; continuing with the local/template fallback."
            exit 0
          fi
          response="$(curl -sS -w '\n%{http_code}' \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"contents":[{"parts":[{"text":"Reply with exactly: GEMINI_OK"}]}],"generationConfig":{"maxOutputTokens":10}}')"
          status="$(printf '%s\n' "$response" | tail -n 1)"
          body="$(printf '%s\n' "$response" | sed '$d')"
          if [ "$status" != "200" ]; then
            echo "Gemini API verification failed; continuing with fallback."
            exit 0
          fi
          if ! printf '%s\n' "$body" | grep -q "GEMINI_OK"; then
            echo "Gemini API response was unexpected; continuing with fallback."
            exit 0
          fi
          echo "Gemini API verification passed."
      - name: Smoke-test ElevenLabs, Pexels, and Pixabay APIs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ELEVENLABS_API_KEY:-}" || { echo "ELEVENLABS_API_KEY is missing"; exit 1; }
          test -n "${PEXELS_API_KEY:-}" || { echo "PEXELS_API_KEY is missing"; exit 1; }
          test -n "${PIXABAY_API_KEY:-}" || { echo "PIXABAY_API_KEY is missing"; exit 1; }
          eleven_status="$(curl -sS -o /dev/null -w '%{http_code}' -H "xi-api-key: ${ELEVENLABS_API_KEY}" https://api.elevenlabs.io/v1/user)"
          pexels_status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: ${PEXELS_API_KEY}" 'https://api.pexels.com/v1/videos/search?query=football&per_page=1')"
          pixabay_status="$(curl -sS -o /dev/null -w '%{http_code}' 'https://pixabay.com/api/videos/?key='${PIXABAY_API_KEY}'&q=football&per_page=3')"
          echo "ElevenLabs API status: ${eleven_status}"
          echo "Pexels API status: ${pexels_status}"
          echo "Pixabay API status: ${pixabay_status}"
          test "${eleven_status}" = "200"
          test "${pexels_status}" = "200"
          test "${pixabay_status}" = "200"
          echo "All three API credentials are valid and reachable."

      - name: Report video-engine availability
        env:
          AI_VIDEO_ENABLED: "false"
          VIDEO_ENGINE: "pollinations"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python - <<'PY'
          from ai_video import available_engines
          engines = available_engines()
          print("AI video engines available:", engines)
          if not engines:
              print("WARNING: no AI video engine secret is configured; the renderer will use its visual fallback.")
          PY

      - name: Run complete viral video pipeline
        env:
          DRY_RUN: "false"
          ZERO_COST_MODE: "true"
          MAX_TRENDS: "12"
          VIDEO_COUNT: "3"
          VIDEO_SECONDS: "20"
          VIDEO_MIN_SECONDS: "15"
          VIDEO_MAX_SECONDS: "60"
          AI_MODE: "ai"
          GEMINI_ENABLED: "false"
          GEMINI_ORIGINALITY_ENABLED: "true"
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_VISUAL_QC_ENABLED: "false"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_ENGINE: "local"
          AI_VIDEO_ENABLED: "true"
          AI_VIDEO_PROVIDER: "fal-ai"
          AI_VIDEO_MODEL: "Wan-AI/Wan2.1-T2V-1.3B"
          AI_VIDEO_TIMEOUT: "180"
          AI_VIDEO_MAX_CLIPS: "2"
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: "flux"
          POLLINATIONS_VIDEO_MODEL: "wan-fast"
          POLLINATIONS_MAX_IMAGES_PER_VIDEO: "6"
          POLLINATIONS_MAX_MOTION_CLIPS_PER_VIDEO: "2"
          POLLINATIONS_VIDEO_SECONDS: "4"
          TTS_ENGINE: "auto"
          TTS_VOICE: "en-US-GuyNeural"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          ELEVENLABS_ENABLED: "true"
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: "JBFqnCBsd6RMkjVDRZzb"
          ELEVENLABS_MODEL: "eleven_flash_v2_5"
          YOUTUBE_ENABLED: "true"
          YOUTUBE_COMMENTARY_MODE: "voice"
          YOUTUBE_CLIPS_PER_VIDEO: "10"
          YOUTUBE_CLIP_SECONDS: "6"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INTERNET_ARCHIVE_ENABLED: "true"
          TIKTOK_ENABLED: "false"
          PUBLISH_ENABLED: "false"
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          PUBLISH_PRIVACY: "private"
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Check generated outputs
        if: success()
        run: |
          set -e
          test -f output/run_summary.json
          test -f output/quality_report.json
          count="$(find output -maxdepth 1 -name '*.mp4' -type f | wc -l)"
          test "$count" -eq 3
          for video in output/*.mp4; do
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$video" | grep -qx 'aac'
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$video"
          done
          youtube_count="$(find output -maxdepth 1 -name 'youtube_commentary_*.mp4' -type f | wc -l)"
          test "$youtube_count" -ge 1
          for video in output/youtube_commentary_*.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$video" | grep -qx '1920,1080'
          done
          echo "Generated exactly 3 videos; YouTube uses real reusable footage + commentary:"
          ls -lh output/*.mp4

      - name: Create compact visual inspection previews
        if: success()
        run: |
          set -euo pipefail
          rm -rf preview_artifact
          mkdir -p preview_artifact
          count=0
          for video in output/*.mp4; do
            [ -f "$video" ] || continue
            count=$((count + 1))
            base="$(basename "$video" .mp4)"
            ffmpeg -y -loglevel error -i "$video" \
              -vf "scale=640:360:force_original_aspect_ratio=decrease,pad=640:360:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 -preset veryfast -crf 32 -maxrate 350k -bufsize 700k \
              -pix_fmt yuv420p -c:a aac -b:a 48k -movflags +faststart \
              "preview_artifact/${base}_preview.mp4"
          done
          test "$count" -gt 0
          echo "Created compact previews:"
          ls -lh preview_artifact/*.mp4
          du -sh preview_artifact
      - name: Save compact previews for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viral-video-previews-run-${{ github.run_number }}
          path: preview_artifact/
          if-no-files-found: warn
          retention-days: 7

      - name: Persist self-learning state
        if: always()
        run: |
          if [ -f learning_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add learning_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update self-learning state [skip ci]"
              git push
            fi
          fi

      - name: Save generated videos and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viral-videos-visual-inspection-run-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
